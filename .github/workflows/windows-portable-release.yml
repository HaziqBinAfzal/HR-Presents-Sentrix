name: Build Compiled Sentrix Windows Edition

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Compile, test and package customer ZIP
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      APP_ENV: development
      FLASK_DEBUG: '0'
      HOST: '127.0.0.1'
      PORT: '5000'
      DATABASE_AUTO_CREATE: '1'
      MAIL_SUPPRESS_SEND: '1'
      WTF_CSRF_ENABLED: '0'
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nuitka ordered-set zstandard

      - name: Validate source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m compileall -q app.py config.py database.py extensions.py forms.py models.py settings_models.py analyzer helpers
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile Sentrix with Nuitka
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --output-dir=build `
            --output-filename=Sentrix.exe `
            --windows-console-mode=force `
            --include-package=analyzer `
            --include-package=helpers `
            --include-package=pylint `
            --include-package=astroid `
            --include-package=bandit `
            --include-package=black `
            --include-package=radon `
            --include-package-data=pylint `
            --include-package-data=astroid `
            --include-package-data=bandit `
            --include-package-data=black `
            --include-package-data=radon `
            --include-data-dir=templates=templates `
            --include-data-dir=static=static `
            app.py
          if ($LASTEXITCODE -ne 0) { throw 'Nuitka compilation failed.' }

      - name: Assemble licensed Windows package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $packageRoot = 'release\Sentrix-v1.0.0-Windows'
          $runtimeRoot = Join-Path $packageRoot 'Runtime'
          Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
          Copy-Item -Path 'build\app.dist\*' -Destination $runtimeRoot -Recurse -Force
          Copy-Item 'COMMERCIAL_LICENSE.md' (Join-Path $packageRoot 'COMMERCIAL_LICENSE.md') -Force
          @'
          @echo off
          setlocal
          title Sentrix
          cd /d "%~dp0"
          if not exist "%LOCALAPPDATA%\Sentrix" mkdir "%LOCALAPPDATA%\Sentrix"
          set "SENTRIX_DATA_DIR=%LOCALAPPDATA%\Sentrix"
          set "APP_ENV=development"
          set "DATABASE_AUTO_CREATE=1"
          set "FLASK_DEBUG=0"
          set "HOST=127.0.0.1"
          set "PORT=5000"
          echo Starting Sentrix...
          start "" powershell.exe -NoProfile -WindowStyle Hidden -Command "Start-Sleep -Seconds 3; Start-Process 'http://127.0.0.1:5000'"
          "%~dp0Runtime\Sentrix.exe"
          pause
          endlocal
          '@ | Set-Content (Join-Path $packageRoot 'Start Sentrix.bat') -Encoding ASCII
          @'
          SENTRIX v1.0.0 - WINDOWS EDITION
          Presented by HR-Presents

          HOW TO START
          1. Extract this ZIP completely.
          2. Double-click "Start Sentrix.bat".
          3. Keep the console window open while using Sentrix.
          4. Your browser opens at http://127.0.0.1:5000.

          LICENSE
          This package is commercial software. Read COMMERCIAL_LICENSE.md included in this folder before use.
          Copyright (c) 2026 HR-Presents. All rights reserved.
          '@ | Set-Content (Join-Path $packageRoot 'README.txt') -Encoding UTF8
          @'
          SENTRIX COMMERCIAL SOFTWARE
          Copyright (c) 2026 HR-Presents. All rights reserved.

          The complete license terms are supplied in COMMERCIAL_LICENSE.md in this package.
          By using an authorized paid copy of Sentrix, the purchaser receives only the rights granted by those terms or a separate written agreement from HR-Presents.
          Third-party components remain subject to their respective licenses.
          '@ | Set-Content (Join-Path $packageRoot 'LICENSE.txt') -Encoding UTF8

      - name: Create ZIP and checksum
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'release\Sentrix-v1.0.0-Windows.zip'
          Compress-Archive -Path 'release\Sentrix-v1.0.0-Windows' -DestinationPath $zip -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  Sentrix-v1.0.0-Windows.zip" | Set-Content 'release\Sentrix-v1.0.0-Windows.sha256.txt' -Encoding ASCII

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sentrix-v1.0.0-Windows-Licensed
          path: |
            release/Sentrix-v1.0.0-Windows.zip
            release/Sentrix-v1.0.0-Windows.sha256.txt
          if-no-files-found: error
          retention-days: 30
