name: Publish Sentrix Portable Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/windows-portable-release.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: sentrix-v1-portable-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse validated portable ZIP
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release,artifact | Out-Null

          $artifactUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/9018108246/zip"
          curl.exe -L --fail `
            -H "Authorization: Bearer $env:GH_TOKEN" `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            $artifactUrl -o artifact.zip
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path artifact.zip)) { throw 'Could not download the validated portable artifact.' }

          Expand-Archive -LiteralPath artifact.zip -DestinationPath artifact -Force
          $sourceZip = Get-ChildItem artifact -Recurse -File -Filter 'Sentrix-v1-Windows-Portable.zip' | Select-Object -First 1
          if (-not $sourceZip) { throw 'Validated portable ZIP was not found inside the Actions artifact.' }
          Copy-Item -LiteralPath $sourceZip.FullName -Destination 'release\Sentrix-v1-Windows-Portable.zip' -Force

          $verify = Join-Path $PWD 'verify-portable'
          Remove-Item $verify -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath 'release\Sentrix-v1-Windows-Portable.zip' -DestinationPath $verify -Force
          foreach ($required in @('Start Sentrix.bat','App\app.py','Runtime\Python\python.exe')) {
            if (-not (Test-Path (Join-Path $verify $required))) { throw "Portable package is missing $required" }
          }

          $hash = (Get-FileHash -Algorithm SHA256 'release\Sentrix-v1-Windows-Portable.zip').Hash.ToLowerInvariant()
          "$hash  Sentrix-v1-Windows-Portable.zip" | Set-Content 'release\Sentrix-v1-Windows-Portable.sha256.txt' -Encoding ASCII
          Write-Host "Validated portable ZIP SHA256: $hash"

      - name: Create clean current v1.0.0 release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          @'
          # Sentrix v1.0.0 - Portable Windows

          Sentrix is a local Windows application by **HR-Presents** for Python code quality, security, complexity analysis, and professional reports.

          ## Download

          Under **Assets**, download **`Sentrix-v1-Windows-Portable.zip`**.

          Do not use GitHub's automatically generated **Source code (zip)** or **Source code (tar.gz)** unless you specifically want the source code.

          ## Start Sentrix

          1. Download `Sentrix-v1-Windows-Portable.zip`.
          2. Right-click the ZIP and choose **Extract All**.
          3. Open the extracted folder.
          4. Double-click **`Start Sentrix.bat`**.
          5. Keep the Sentrix console window open while using the application.
          6. Sentrix opens locally at `http://127.0.0.1:5000`.

          **Python 3.13 and the required dependencies are bundled. No separate Python installation is required.**

          ## What Sentrix includes

          - Python file and project ZIP analysis
          - Pylint code-quality analysis
          - Bandit security scanning
          - Black formatting checks
          - Radon complexity analysis
          - Project scoring and findings
          - Analysis history
          - Professional downloadable reports
          - Local user accounts and protected project data

          ## Privacy

          Sentrix runs locally on the user's Windows computer. Application data is stored under `%LOCALAPPDATA%\Sentrix`.

          ## Verify the download

          `Sentrix-v1-Windows-Portable.sha256.txt` is included as a release asset for checksum verification.

          **Presented by HR-Presents.**
          '@ | Set-Content 'release\RELEASE_BODY.md' -Encoding UTF8

          gh release delete v1.0.0 --cleanup-tag -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove the stale v1.0.0 release/tag.' }

          gh release create v1.0.0 `
            'release/Sentrix-v1-Windows-Portable.zip' `
            'release/Sentrix-v1-Windows-Portable.sha256.txt' `
            --target "$env:GITHUB_SHA" `
            --title 'Sentrix v1.0.0 - Portable Windows' `
            --notes-file 'release/RELEASE_BODY.md' `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the clean portable v1.0.0 release.' }

          gh release view v1.0.0 --json tagName,name,isLatest,targetCommitish,assets
          if ($LASTEXITCODE -ne 0) { throw 'Published release verification failed.' }
