name: One-time Sentrix branding cleanup

on:
  push:
    branches:
      - production/sentrix-permanent

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out permanent branch
        uses: actions/checkout@v4
        with:
          ref: production/sentrix-permanent
          fetch-depth: 0

      - name: Replace legacy product branding in tracked text files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text_suffixes = {
              '.css', '.html', '.jinja', '.jinja2', '.js', '.json', '.md',
              '.py', '.txt', '.toml', '.yaml', '.yml', '.conf', '.ini', '.cfg'
          }
          excluded_parts = {'.git', 'venv', '.venv', '__pycache__'}
          replacements = (
              ('CodeSentinel AI', 'Sentrix'),
              ('CodeSentinel', 'Sentrix'),
          )

          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if any(part in excluded_parts for part in path.parts):
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {'.env.example', '.gitignore', '.dockerignore'}:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated files:')
          for item in changed:
              print(f' - {item}')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/one-time-sentrix-brand-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes were required."
            exit 0
          fi
          git commit -m "chore: remove remaining CodeSentinel branding"
          git push origin HEAD:production/sentrix-permanent
