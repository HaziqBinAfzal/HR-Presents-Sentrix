name: Review verification

on:
  push:
    branches:
      - agent/dynamic-reviews
    paths:
      - tests/test_reviews.py
      - analyzer/routes/main.py
      - templates/reviews.html
      - templates/edit_review.html
      - helpers/review_service.py
      - .github/workflows/review-tests.yml

permissions:
  contents: read

jobs:
  review-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate application syntax
        run: python -m py_compile analyzer/routes/main.py helpers/review_service.py tests/test_reviews.py

      - name: Run review flow tests
        env:
          APP_ENV: testing
          SECRET_KEY: review-ci-secret
          DATABASE_URL: sqlite:///:memory:
        run: python -m unittest -v tests.test_reviews
