name: Repair review routes

on:
  push:
    branches:
      - agent/dynamic-reviews
    paths:
      - .github/workflows/repair-review-routes.yml
      - scripts/repair_review_routes.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dynamic-reviews
          fetch-depth: 0

      - name: Clean review backend routes
        run: python scripts/repair_review_routes.py

      - name: Validate review route cleanup
        run: |
          test "$(grep -c 'def edit_review' analyzer/routes/main.py)" -eq 1
          test "$(grep -c 'def remove_review' analyzer/routes/main.py)" -eq 1
          test "$(grep -c '@main.route("/reviews/delete/<int:review_id>"' analyzer/routes/main.py)" -eq 1
          grep -q 'delete_review as delete_review_record' analyzer/routes/main.py
          grep -q 'delete_review_record(review)' analyzer/routes/main.py

      - name: Commit repaired routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer/routes/main.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix duplicate and malformed review routes"
          git push origin HEAD:agent/dynamic-reviews
