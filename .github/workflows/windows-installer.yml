name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - agent/sentrix-windows-installer
    paths:
      - 'installer/**'
      - 'app.py'
      - 'analyzer/**'
      - 'templates/**'
      - 'static/**'
      - 'requirements.txt'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build Sentrix installer
        shell: powershell
        run: ./installer/build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sentrix-v1-Windows-Installer
          path: dist/windows/Sentrix-v1-Setup.exe
          if-no-files-found: error
          retention-days: 30
