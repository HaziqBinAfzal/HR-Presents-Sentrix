name: Sentrix CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "agent/**"
  pull_request:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application sources
        run: |
          python -m compileall -q app.py config.py database.py extensions.py forms.py models.py analyzer helpers

      - name: Import application factory
        env:
          APP_ENV: testing
          SECRET_KEY: ci-only-secret
          DATABASE_URL: sqlite:///:memory:
        run: |
          python -c "from app import create_app; app = create_app(); print(app.url_map)"

  docker:
    name: Build production container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sentrix:rc1
