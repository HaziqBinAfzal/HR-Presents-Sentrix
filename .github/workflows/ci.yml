name: Sentrix CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "agent/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentrix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    env:
      APP_ENV: testing
      SECRET_KEY: ci-only-secret
      DATABASE_URL: "sqlite:///:memory:"
      WTF_CSRF_ENABLED: "0"
      MAIL_SUPPRESS_SEND: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application and tests
        run: |
          python -m compileall -q \
            app.py config.py database.py extensions.py \
            forms.py models.py settings_models.py \
            analyzer helpers tests

      - name: Import application factory
        run: python -c "from app import create_app; app = create_app(); print(f'Loaded {len(list(app.url_map.iter_rules()))} routes')"

      - name: Run unit and security tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  docker:
    name: Build production container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sentrix:rc1
          cache-from: type=gha
          cache-to: type=gha,mode=max
