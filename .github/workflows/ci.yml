name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import application
        env:
          APP_ENV: testing
          SECRET_KEY: ci-only-secret
          DATABASE_URL: sqlite:///:memory:
        run: python -c "from app import create_app; app = create_app(); print(app.url_map)"

      - name: Test review CRUD and authorization
        env:
          APP_ENV: testing
          SECRET_KEY: ci-only-secret
          DATABASE_URL: sqlite:///:memory:
        run: python -m unittest -v tests.test_reviews

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --strict

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sentrix:rc1
