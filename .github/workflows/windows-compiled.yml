name: Build Compiled Sentrix Windows Edition

on:
  workflow_dispatch:
  push:
    branches:
      - agent/sentrix-portable-latest
    paths:
      - 'app.py'
      - 'analyzer/**'
      - 'helpers/**'
      - 'templates/**'
      - 'static/**'
      - 'migrations/**'
      - 'requirements.txt'
      - 'config.py'
      - 'database.py'
      - 'extensions.py'
      - 'forms.py'
      - 'models.py'
      - 'settings_models.py'
      - '.github/workflows/windows-compiled.yml'

concurrency:
  group: sentrix-windows-compiled
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Windows-ready Sentrix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync website UI from production source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin production/sentrix-permanent
          git checkout origin/production/sentrix-permanent -- templates static
          $productionSha = (git rev-parse origin/production/sentrix-permanent).Trim()
          $windowsSha = (git rev-parse HEAD).Trim()
          Write-Host "Website UI source (production/sentrix-permanent): $productionSha"
          Write-Host "Windows runtime source: $windowsSha"
          "PRODUCTION_UI_SHA=$productionSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_RUNTIME_SHA=$windowsSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify production website files are exact
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code origin/production/sentrix-permanent -- templates static
          if ($LASTEXITCODE -ne 0) { throw 'Website templates/static do not match production/sentrix-permanent.' }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install build dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'requirements installation failed.' }
          python -m pip install nuitka ordered-set zstandard
          if ($LASTEXITCODE -ne 0) { throw 'Nuitka build dependency installation failed.' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Installed Python dependencies are inconsistent.' }

      - name: Preflight analyzer runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from analyzer.complexity import run_radon
          from analyzer.formatter import run_black
          from analyzer.lint import run_pylint
          from analyzer.security import run_bandit
          from analyzer.syntax import check_syntax

          with TemporaryDirectory() as temp_dir:
              root = Path(temp_dir)
              clean_file = root / "clean_sample.py"
              clean_file.write_text(
                  '"""Sentrix analyzer smoke test."""\n\n'
                  'def add(left, right):\n'
                  '    """Return two values added together."""\n'
                  '    return left + right\n',
                  encoding="utf-8",
              )

              syntax_result = check_syntax(str(clean_file))
              assert syntax_result.get("valid") is True, syntax_result

              pylint_result = run_pylint(str(clean_file))
              score = float(pylint_result.get("score"))
              assert 0.0 <= score <= 10.0, pylint_result
              assert isinstance(pylint_result.get("issues"), list), pylint_result
              assert "error" not in pylint_result, pylint_result

              poor_file = root / "poor_sample.py"
              poor_file.write_text(
                  'import os\n\n'
                  'def BAD_NAME(x):\n'
                  '    unused = 1\n'
                  '    return x\n',
                  encoding="utf-8",
              )
              poor_pylint = run_pylint(str(poor_file))
              assert "error" not in poor_pylint, poor_pylint
              assert len(poor_pylint.get("issues", [])) > 0, poor_pylint

              black_result = run_black(str(clean_file))
              assert black_result.get("status") in {"Passed", "Needs Formatting"}, black_result
              assert "error" not in black_result, black_result

              radon_result = run_radon(str(clean_file))
              assert isinstance(radon_result, list), radon_result

              bandit_result = run_bandit(str(root))
              assert isinstance(bandit_result.get("issues"), list), bandit_result
              assert "error" not in bandit_result, bandit_result

              broken_file = root / "broken_sample.py"
              broken_file.write_text("def broken(:\n    pass\n", encoding="utf-8")
              broken_syntax = check_syntax(str(broken_file))
              assert broken_syntax.get("valid") is False, broken_syntax

          print("Sentrix analyzer preflight passed.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Analyzer preflight failed; compilation intentionally skipped.' }

      - name: Build Windows icon from Sentrix logo
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build-assets | Out-Null
          @'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          source = Path("static/images/sentrix-electric-spark-wing.png")
          target = Path("build-assets/Sentrix.ico")
          if not source.is_file():
              raise SystemExit(f"Sentrix logo missing: {source}")

          with Image.open(source) as opened:
              image = opened.convert("RGBA")
          image.thumbnail((224, 224), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
          left = (canvas.width - image.width) // 2
          top = (canvas.height - image.height) // 2
          canvas.alpha_composite(image, (left, top))
          canvas.save(
              target,
              format="ICO",
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          if not target.is_file() or target.stat().st_size == 0:
              raise SystemExit("Sentrix.ico was not created.")
          print(f"Created {target} ({target.stat().st_size} bytes)")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Sentrix Windows icon generation failed.' }

      - name: Compile Sentrix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue

          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --output-dir=build `
            --output-filename=Sentrix.exe `
            --include-package=analyzer `
            --include-package=helpers `
            --include-package=pylint `
            --include-package=astroid `
            --include-package=bandit `
            --include-package=black `
            --include-package=radon `
            --include-distribution-metadata=bandit `
            --include-data-dir=templates=templates `
            --include-data-dir=static=static `
            --include-data-dir=migrations=migrations `
            --windows-icon-from-ico=build-assets/Sentrix.ico `
            --windows-console-mode=force `
            app.py

          if ($LASTEXITCODE -ne 0) { throw 'Nuitka compilation failed.' }

          $dist = Get-ChildItem build -Directory | Where-Object { $_.Name -like '*.dist' } | Select-Object -First 1
          if (-not $dist) { throw 'Compiled Sentrix distribution folder was not produced.' }
          if (-not (Test-Path (Join-Path $dist.FullName 'Sentrix.exe'))) { throw 'Sentrix.exe was not produced.' }

      - name: Assemble customer package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Get-ChildItem build -Directory | Where-Object { $_.Name -like '*.dist' } | Select-Object -First 1
          if (-not $dist) { throw 'Compiled distribution folder missing.' }

          $stage = Join-Path $PWD 'release\Sentrix-v1-Windows'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $runtime = Join-Path $stage 'Runtime'
          Copy-Item -LiteralPath $dist.FullName -Destination $runtime -Recurse -Force
          Copy-Item -LiteralPath 'build-assets\Sentrix.ico' -Destination (Join-Path $stage 'Sentrix.ico') -Force

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "SENTRIX_RUNTIME=%~dp0Runtime"
          set "SENTRIX_DATA_DIR=%LOCALAPPDATA%\Sentrix"
          set "HOST=127.0.0.1"
          set "PORT=5000"
          set "APP_ENV=development"
          set "FLASK_DEBUG=0"

          if not exist "%SENTRIX_DATA_DIR%" mkdir "%SENTRIX_DATA_DIR%"

          echo ========================================
          echo               SENTRIX v1
          echo ========================================
          echo Starting Sentrix...
          echo Data folder: %SENTRIX_DATA_DIR%
          echo.

          powershell.exe -NoProfile -Command "$c=Get-NetTCPConnection -LocalPort 5000 -State Listen -ErrorAction SilentlyContinue; if($c){exit 1}else{exit 0}"
          if errorlevel 1 (
            echo ERROR: Port 5000 is already in use.
            echo Close the old Sentrix instance or other app using port 5000, then try again.
            pause
            exit /b 1
          )

          start "Sentrix" /D "%SENTRIX_RUNTIME%" cmd.exe /k Sentrix.exe

          powershell.exe -NoProfile -Command "$ok=$false; for($i=0;$i -lt 60;$i++){try{Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5000' -TimeoutSec 1 ^| Out-Null; $ok=$true; break}catch{Start-Sleep -Seconds 1}}; if($ok){Start-Process 'http://127.0.0.1:5000'; exit 0}else{exit 1}"
          if errorlevel 1 (
            echo.
            echo Sentrix did not become ready on http://127.0.0.1:5000
            echo The Sentrix console window has been left open so you can read the error.
            pause
            exit /b 1
          )

          exit /b 0
          '@ | Set-Content (Join-Path $stage 'Start Sentrix.bat') -Encoding ASCII

          @"
          SENTRIX v1 - WINDOWS EDITION
          ===========================
          Website UI source (production/sentrix-permanent): $env:PRODUCTION_UI_SHA
          Windows runtime source: $env:WINDOWS_RUNTIME_SHA
          Sentrix runs locally at http://127.0.0.1:5000.
          "@ | Set-Content (Join-Path $stage 'README.txt') -Encoding UTF8

          $forbidden = @(
            (Join-Path $stage 'app.py'),
            (Join-Path $stage 'analyzer'),
            (Join-Path $stage 'helpers'),
            (Join-Path $stage 'requirements.txt')
          )
          foreach ($item in $forbidden) {
            if (Test-Path $item) { throw "Source-code leak in customer package: $item" }
          }

          if (-not (Test-Path (Join-Path $runtime 'Sentrix.exe'))) {
            throw 'Customer package is missing Runtime\Sentrix.exe.'
          }
          if (-not (Test-Path (Join-Path $stage 'Sentrix.ico'))) {
            throw 'Customer package is missing Sentrix.ico.'
          }

          $zip = Join-Path $PWD 'release\Sentrix-v1-Windows-Compiled.zip'
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw 'Customer ZIP was not created.' }

      - name: Upload compiled customer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sentrix-v1-Windows-Compiled
          path: release/Sentrix-v1-Windows-Compiled.zip
          if-no-files-found: error
          retention-days: 30
