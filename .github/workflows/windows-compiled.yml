name: Build Fast Portable Sentrix Windows ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - agent/sentrix-portable-latest
    paths:
      - 'app.py'
      - 'analyzer/**'
      - 'helpers/**'
      - 'templates/**'
      - 'static/**'
      - 'migrations/**'
      - 'requirements.txt'
      - 'config.py'
      - 'database.py'
      - 'extensions.py'
      - 'forms.py'
      - 'models.py'
      - 'settings_models.py'
      - '.github/workflows/windows-compiled.yml'

concurrency:
  group: sentrix-windows-compiled
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Sentrix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync production website UI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin production/sentrix-permanent
          git checkout origin/production/sentrix-permanent -- templates static
          $productionSha = (git rev-parse origin/production/sentrix-permanent).Trim()
          $windowsSha = (git rev-parse HEAD).Trim()
          "PRODUCTION_UI_SHA=$productionSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_RUNTIME_SHA=$windowsSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Sentrix dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Installed Python dependencies are inconsistent.' }

      - name: Verify analyzers before packaging
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from analyzer.lint import run_pylint
          from analyzer.security import run_bandit
          from analyzer.formatter import run_black
          from analyzer.complexity import run_radon

          with TemporaryDirectory() as temp_dir:
              root = Path(temp_dir)
              sample = root / "sample.py"
              sample.write_text('def add(a, b):\n    return a + b\n', encoding='utf-8')
              pylint_result = run_pylint(str(sample))
              assert 'error' not in pylint_result, pylint_result
              assert 0 <= float(pylint_result['score']) <= 10, pylint_result
              assert 'error' not in run_bandit(str(root)), run_bandit(str(root))
              assert 'error' not in run_black(str(sample)), run_black(str(sample))
              assert isinstance(run_radon(str(sample)), list)
          print('Analyzer smoke test passed.')
          '@ | python -

      - name: Assemble portable Windows package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $release = Join-Path $PWD 'release'
          $stage = Join-Path $release 'Sentrix-v1-Windows-Portable'
          $appDir = Join-Path $stage 'App'
          $runtimeDir = Join-Path $stage 'Runtime\Python'

          Remove-Item $release -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null

          # Copy the application source. This fast package intentionally favors
          # startup reliability and build speed over source-code protection.
          robocopy $PWD $appDir /E /R:1 /W:1 `
            /XD .git .github release build build-assets venv .venv __pycache__ tests installer `
            /XF *.pyc .env
          if ($LASTEXITCODE -ge 8) { throw "Application copy failed with robocopy exit code $LASTEXITCODE." }

          # Copy the complete setup-python installation after dependencies have
          # been installed. Unlike a venv, this remains self-contained when moved.
          $pythonRoot = (& python -c "import sys; print(sys.base_prefix)").Trim()
          if (-not (Test-Path (Join-Path $pythonRoot 'python.exe'))) {
            throw "Python runtime not found at $pythonRoot"
          }
          robocopy $pythonRoot $runtimeDir /E /R:1 /W:1 /XD __pycache__ /XF *.pyc
          if ($LASTEXITCODE -ge 8) { throw "Python runtime copy failed with robocopy exit code $LASTEXITCODE." }

          @'
          @echo off
          setlocal
          cd /d "%~dp0"

          set "SENTRIX_APP=%~dp0App"
          set "SENTRIX_PYTHON=%~dp0Runtime\Python\python.exe"
          set "SENTRIX_DATA_DIR=%LOCALAPPDATA%\Sentrix"
          set "HOST=127.0.0.1"
          set "PORT=5000"
          set "APP_ENV=development"
          set "FLASK_DEBUG=0"
          set "PYTHONNOUSERSITE=1"

          if not exist "%SENTRIX_DATA_DIR%" mkdir "%SENTRIX_DATA_DIR%"

          if not exist "%SENTRIX_PYTHON%" (
            echo ERROR: The bundled Sentrix Python runtime is missing.
            pause
            exit /b 1
          )

          powershell.exe -NoProfile -Command "$c=Get-NetTCPConnection -LocalPort 5000 -State Listen -ErrorAction SilentlyContinue; if($c){exit 1}else{exit 0}"
          if errorlevel 1 (
            echo ERROR: Port 5000 is already in use.
            echo Close the old Sentrix window and try again.
            pause
            exit /b 1
          )

          start "Sentrix" /D "%SENTRIX_APP%" "%SENTRIX_PYTHON%" "%SENTRIX_APP%\app.py"

          powershell.exe -NoProfile -Command "$ok=$false; for($i=0;$i -lt 60;$i++){try{Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5000' -TimeoutSec 1 ^| Out-Null; $ok=$true; break}catch{Start-Sleep -Seconds 1}}; if($ok){Start-Process 'http://127.0.0.1:5000'; exit 0}else{exit 1}"
          if errorlevel 1 (
            echo.
            echo Sentrix did not become ready at http://127.0.0.1:5000
            pause
            exit /b 1
          )
          exit /b 0
          '@ | Set-Content (Join-Path $stage 'Start Sentrix.bat') -Encoding ASCII

          @"
          SENTRIX v1 - FAST PORTABLE WINDOWS EDITION
          ==========================================

          1. Extract this ZIP completely.
          2. Double-click Start Sentrix.bat.
          3. Sentrix opens at http://127.0.0.1:5000.

          Python is bundled. No separate Python installation is required.
          Website UI source: $env:PRODUCTION_UI_SHA
          Sentrix source: $env:WINDOWS_RUNTIME_SHA
          "@ | Set-Content (Join-Path $stage 'README.txt') -Encoding UTF8

          if (-not (Test-Path (Join-Path $appDir 'app.py'))) { throw 'Portable package is missing App\app.py.' }
          if (-not (Test-Path (Join-Path $runtimeDir 'python.exe'))) { throw 'Portable package is missing Runtime\Python\python.exe.' }

          # Prove the copied runtime can import the exact analyzers that previously
          # failed after Nuitka packaging.
          Push-Location $appDir
          try {
            & (Join-Path $runtimeDir 'python.exe') -c "import flask, pylint, bandit, black, radon; from analyzer.lint import run_pylint; print('Portable runtime imports passed')"
            if ($LASTEXITCODE -ne 0) { throw 'Bundled Python runtime import test failed.' }
          } finally {
            Pop-Location
          }

          $zip = Join-Path $release 'Sentrix-v1-Windows-Portable.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Fastest
          if (-not (Test-Path $zip)) { throw 'Portable ZIP was not created.' }

          Write-Host "Created: $zip"
          Write-Host "Size: $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB"

      - name: Upload portable customer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sentrix-v1-Windows-Portable
          path: release/Sentrix-v1-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
