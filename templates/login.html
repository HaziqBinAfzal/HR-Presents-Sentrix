{% extends "base.html" %}

{% block title %}Login | CodeSentinel AI{% endblock %}

{% block content %}

<section class="py-5 min-vh-100 d-flex align-items-center">

    <div class="container">

        <div class="row justify-content-center align-items-center">

            <div class="col-lg-5 col-md-7">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <i class="fa-solid fa-user-shield fa-4x text-primary mb-3"></i>

                            <h2 class="fw-bold">
                                Welcome Back
                            </h2>

                            <p class="text-muted">
                                Login to your CodeSentinel AI account and continue analyzing your Python projects.
                            </p>

                        </div>

                        <form method="POST">

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>

                                    <input
                                        type="email"
                                        class="form-control"
                                        name="email"
                                        placeholder="Enter your email"
                                        required>

                                </div>

                            </div>

                            <div class="mb-4">

                                <label class="form-label fw-semibold">
                                    Password
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>

                                    <input
                                        type="password"
                                        class="form-control"
                                        name="password"
                                        placeholder="Enter your password"
                                        required>

                                </div>

                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="remember">

                                    <label
                                        class="form-check-label"
                                        for="remember">

                                        Remember Me

                                    </label>

                                </div>

                                <a href="#" class="text-decoration-none">
                                    Forgot Password?
                                </a>

                            </div>

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">

                                    <i class="fa-solid fa-right-to-bracket me-2"></i>

                                    Login

                            <div class="text-end mb-3">
                                   <a href="{{ url_for('main.forgot_password') }}"
                                     class="text-decoration-none">
                                    Forgot Password?
                                </a>
                            </div>
                           
                            <hr>

                            <div class="text-center">

                               <p>

                                    Don't have an account?

                               </p>

                               <a href="{{ url_for('main.register') }}"
                                  class="btn btn-outline-primary">

                                    Create Account

                               </a>

                           </div>
                            
                                </button>

                            </div>

                        </form>

                        <hr class="my-4">

                        <div class="text-center">

                            <p class="mb-0">

                                Don't have an account?

                                <a
                                    href="{{ url_for('main.register') }}"
                                    class="fw-bold text-decoration-none">

                                    Create Account

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
