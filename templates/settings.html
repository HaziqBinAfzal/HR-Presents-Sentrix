{% extends "base.html" %}

{% block title %}Settings | CodeSentinel AI{% endblock %}

{% block content %}

<section class="py-5">

    <div class="container">

        <div class="text-center mb-5">

            <i class="fa-solid fa-gear fa-4x text-primary mb-3"></i>

            <h2 class="fw-bold">

                Account Settings

            </h2>

            <p class="text-muted">

                Manage your account preferences and application settings.

            </p>

        </div>

        <div class="row">

            <div class="col-lg-8">

                <div class="card shadow-lg border-0 rounded-4 mb-4">

                    <div class="card-header bg-white">

                        <h4>

                            General Settings

                        </h4>

                    </div>

                    <div class="card-body">

                        <form>

                            <div class="mb-3">

                                <label class="form-label">

                                    Full Name

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    value="John Doe">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    value="john@example.com">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Username

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    value="johndoe">

                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Save Changes

                            </button>

                        </form>

                    </div>

                </div>

                <div class="card shadow-lg border-0 rounded-4 mb-4">

                    <div class="card-header bg-white">

                        <h4>

                            Notification Settings

                        </h4>

                    </div>

                    <div class="card-body">

                        <div class="form-check form-switch mb-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                checked>

                            <label class="form-check-label">

                                Email Notifications

                            </label>

                        </div>

                        <div class="form-check form-switch mb-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                checked>

                            <label class="form-check-label">

                                Analysis Completion Alerts

                            </label>

                        </div>

                        <div class="form-check form-switch">

                            <input
                                class="form-check-input"
                                type="checkbox">

                            <label class="form-check-label">

                                Newsletter

                            </label>

                        </div>

                    </div>

                </div>

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-header bg-white">

                        <h4>

                            Appearance

                        </h4>

                    </div>

                    <div class="card-body">

                        <div class="form-check form-switch mb-3">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="darkMode">

                            <label
                                class="form-check-label"
                                for="darkMode">

                                Enable Dark Mode

                            </label>

                        </div>

                        <button
                            class="btn btn-success">

                            Save Preferences

                        </button>

                    </div>

                </div>

            </div>

            <div class="col-lg-4">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-header bg-white">

                        <h4>

                            Security

                        </h4>

                    </div>

                    <div class="card-body">

                        <button
                            class="btn btn-warning w-100 mb-3">

                            Change Password

                        </button>

                        <button
                            class="btn btn-danger w-100">

                            Delete Account

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
