{% extends "base.html" %}

{% block title %}Register | CodeSentinel AI{% endblock %}

{% block content %}

<section class="py-5 min-vh-100 d-flex align-items-center">

    <div class="container">

        <div class="row justify-content-center align-items-center">

            <div class="col-lg-6 col-md-8">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <i class="fa-solid fa-user-plus fa-4x text-primary mb-3"></i>

                            <h2 class="fw-bold">
                                Create Your Account
                            </h2>

                            <p class="text-muted">
                                Join CodeSentinel AI and start analyzing, formatting, and securing your Python projects.
                            </p>

                        </div>

                        <form method="POST">

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Full Name
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-user"></i>
                                    </span>

                                    <input
                                        type="text"
                                        class="form-control"
                                        name="fullname"
                                        placeholder="Enter your full name"
                                        required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-envelope"></i>
                                    </span>

                                    <input
                                        type="email"
                                        class="form-control"
                                        name="email"
                                        placeholder="Enter your email"
                                        required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Username
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-at"></i>
                                    </span>

                                    <input
                                        type="text"
                                        class="form-control"
                                        name="username"
                                        placeholder="Choose a username"
                                        required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Password
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>

                                    <input
                                        type="password"
                                        class="form-control"
                                        name="password"
                                        placeholder="Create a password"
                                        required>

                                </div>

                            </div>

                            <div class="mb-4">

                                <label class="form-label fw-semibold">
                                    Confirm Password
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>

                                    <input
                                        type="password"
                                        class="form-control"
                                        name="confirm_password"
                                        placeholder="Confirm your password"
                                        required>

                                </div>

                            </div>

                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    required>

                                <label
                                    class="form-check-label"
                                    for="terms">

                                    I agree to the
                                    <a href="#" class="text-decoration-none">
                                        Terms & Conditions
                                    </a>

                                </label>

                            </div>

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">

                                    <i class="fa-solid fa-user-plus me-2"></i>

                                    Create Account

                                </button>

                            </div>

                        </form>

                        <hr class="my-4">

                        <div class="text-center">

                            <p class="mb-0">

                                Already have an account?

                                <a
                                    href="{{ url_for('main.login') }}"
                                    class="fw-bold text-decoration-none">

                                    Login Here

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
