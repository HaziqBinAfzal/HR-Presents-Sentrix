{% extends "base.html" %}
{% block title %}Reset Password | Sentrix{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fa-solid fa-key fa-3x text-warning mb-3"></i>
                            <h2 class="fw-bold">Reset Password</h2>
                            <p class="text-muted">Create a new secure password for your Sentrix account.</p>
                        </div>
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label" for="password">New Password</label>
                                <input id="password" type="password" name="password" class="form-control form-control-lg" minlength="8" autocomplete="new-password" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="confirm_password">Confirm Password</label>
                                <input id="confirm_password" type="password" name="confirm_password" class="form-control form-control-lg" minlength="8" autocomplete="new-password" required>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-warning btn-lg">Reset Password</button>
                            </div>
                        </form>
                        <hr>
                        <div class="text-center">
                            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-primary">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
