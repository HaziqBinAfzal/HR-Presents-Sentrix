  <linearGradient id="wingB" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e0fbff"/><stop offset=".45" stop-color="#38bdf8"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
