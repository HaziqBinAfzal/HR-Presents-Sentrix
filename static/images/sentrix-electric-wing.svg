<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">Sentrix Electric Wing</title>
  <desc id="desc">A premium electric-blue wing and shield mark with the Sentrix wordmark.</desc>
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.48" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(10 12)">
    <path d="M72 18 32 38 6 76l44-15-31 42 48-25-12 47 37-39V26Z" fill="url(#wing)" opacity=".92"/>
    <path d="M88 18 128 38l26 38-44-15 31 42-48-25 12 47-37-39V26Z" fill="url(#wing)" opacity=".92"/>
    <path d="M80 14 104 27v39c0 29-18 48-24 53-6-5-24-24-24-53V27Z" fill="#07152f" stroke="#60a5fa" stroke-width="4" filter="url(#glow)"/>
    <path d="m82 32-18 31h14l-8 30 27-39H84l10-22Z" fill="url(#core)"/>
  </g>
  <g transform="translate(184 49)">
    <text x="0" y="45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-2" fill="#0f172a">SENTRIX</text>
    <text x="3" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#2563eb">PRESENTED BY HR-PRESENTS</text>
  </g>
</svg>
